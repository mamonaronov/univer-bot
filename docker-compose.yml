services:
  bot:
    build: .
    image: univer-bot:latest
    container_name: univer-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-socks5://127.0.0.1:11808}
      DB_PATH: /app/data/catalog.sqlite3
    volumes:
      - ./data:/app/data
      - ./mihomo-data:/app/mihomo/providers
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 20s
