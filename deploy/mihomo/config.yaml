mixed-port: 11808
bind-address: 127.0.0.1
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 15
find-process-mode: off
geodata-mode: false
geo-auto-update: false

external-controller: 127.0.0.1:19090
secret: "8176598712630598761082765412765789012506456781928765078960"

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  nameserver:
    - 8.8.8.8
    - 1.1.1.1
  fallback:
    - tls://1.1.1.1
    - tls://8.8.8.8
  fallback-filter:
    geoip: false

proxy-providers:
  sub1:
    type: http
    url: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt"  #Черные Списки VLESS / Все конфиги
    path: ./providers/sub1.yaml
    interval: 900 # раз в 15 мин 3600-час
    size-limit: 10485760
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta"
        - "mihomo"
        - "clash-verge"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 120
      timeout: 4000
      lazy: false
      expected-status: 204
    override:
      additional-prefix: "s1 | "
      udp: true
    exclude-filter: "(?i)expire|expiring|traffic|remain|剩余|流量|过期|官网|套餐|到期|重置|订阅"

  sub2:
    type: http
    url: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt" #Черные Списки Shadowsocks+All / Все конфиги
