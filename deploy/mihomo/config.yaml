proxy-groups:
  - name: AUTO
    # select, not fallback: GET health-checks pass on nodes that RST getUpdates.
    # The bot then PUT-switches to the next node via the local API.
    type: select
    # sub2 first: hysteria/ss. The VLESS lists are currently one dead Chicago
    # REALITY plus decorative vmess that fake GET to Telegram.
    # sub4/sub5 are whitelist — keep them off the bot path.
    use:
      - sub2
      - sub1
      - sub3
    exclude-filter: "(?i)expire|expiring|traffic|remain|剩余|流量|过期|官网|套餐|到期|重置|订阅|🛸|𖥔"

  - name: WHITELIST
    type: select
    use:
      - sub4
      - sub5

  - name: PROXY
    type: select
    proxies:
      - AUTO
      - WHITELIST
      - DIRECT

rules:
  - MATCH,AUTO
