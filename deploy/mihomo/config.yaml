# Mihomo (Clash Meta) — headless client for the handbook bot.
# Copied into the image as /app/mihomo/config.yaml (see Dockerfile).
# Routing schema matches github.com/mamonaronov/mihomo-proxy config.yaml
# (commit: one url-test over sub1…sub5, DoH by IP).
# Ports stay on localhost: mihomo shares this container and is not published.
#   mihomo  mixed       127.0.0.1:11808
#   mihomo  API         127.0.0.1:19090
#
# Apply: docker compose up -d --build
#
# AUTO = url-test(sub1+sub2+sub3+sub4+sub5). No FAST/BACKUP split, no WHITELIST.
# Region exclude is off — Anycast and expire rows only. Bot API health: HTTP 404.
# Providers use SUBSCRIBE: DIRECT first, AUTO if GitHub is blocked.
# Do not point providers at AUTO alone — deadlock when the tunnel is down.
# Cached provider YAML still works if both DIRECT and AUTO fail.

mixed-port: 11808
bind-address: 127.0.0.1
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 15
find-process-mode: off
geodata-mode: false
geo-auto-update: false
global-client-fingerprint: chrome

external-controller: 127.0.0.1:19090
secret: "8176598712630598761082765412765789012506456781928765078960"

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  # SOCKS bots need real IPs. fake-ip is for TUN on a laptop.
  enhanced-mode: redir-host
  # IP-literal DoH: no UDP/53 bootstrap, so RU hijack cannot poison dns.google.
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback:
    - https://1.0.0.1/dns-query
    - https://8.8.4.4/dns-query
  fallback-filter:
    geoip: false

proxy-providers:
  sub1:
    type: http
    url: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt"  #Черные Списки VLESS / Все конфиги
    path: ./providers/sub1.yaml
    interval: 900
    size-limit: 10485760
    proxy: SUBSCRIBE
    header:
      User-Agent:
        - "clash.meta"
        - "mihomo"
        - "clash-verge"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 4000
      lazy: true
      expected-status: 204
    override:
      additional-prefix: "s1 | "
      udp: true
    exclude-filter: "(?i)expire|expiring|traffic|remain|剩余|流量|过期|官网|套餐|到期|重置|订阅"

  sub2:
    type: http
    url: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt" #Черные Списки Shadowsocks+All / Все конфиги
    path: ./providers/sub2.yaml
    interval: 900
    size-limit: 10485760
    proxy: SUBSCRIBE
    header:
      User-Agent:
        - "clash.meta"
        - "mihomo"
        - "clash-verge"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 4000
      lazy: true
      expected-status: 204
    override:
      additional-prefix: "s2 | "
      udp: true
    exclude-filter: "(?i)expire|expiring|traffic|remain|剩余|流量|过期|官网|套餐|到期|重置|订阅"

  sub3:
    type: http
    url: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt" #Черные Списки VLESS / 150 лучших для телефона
    path: ./providers/sub3.yaml
    interval: 900
    size-limit: 10485760
    proxy: SUBSCRIBE
    header:
      User-Agent:
        - "clash.meta"
        - "mihomo"
        - "clash-verge"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 4000
      lazy: true
      expected-status: 204
    override:
      additional-prefix: "s3 | "
      udp: true
    exclude-filter: "(?i)expire|expiring|traffic|remain|剩余|流量|过期|官网|套餐|到期|重置|订阅"

  sub4:
    type: http
    url: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" #Белые Списки / CIDR / Все конфиги
    path: ./providers/sub4.yaml
    interval: 3600
    size-limit: 10485760
    proxy: SUBSCRIBE
    header:
      User-Agent:
        - "clash.meta"
        - "mihomo"
        - "clash-verge"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 4000
      lazy: true
      expected-status: 204
    override:
      additional-prefix: "s4 | "
      udp: true
    exclude-filter: "(?i)expire|expiring|traffic|remain|剩余|流量|过期|官网|套餐|到期|重置|订阅"

  sub5:
    type: http
    url: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt"  #Белые Списки / SNI
    path: ./providers/sub5.yaml
    interval: 3600
    size-limit: 10485760
    proxy: SUBSCRIBE
    header:
      User-Agent:
        - "clash.meta"
        - "mihomo"
        - "clash-verge"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 4000
      lazy: true
      expected-status: 204
    override:
      additional-prefix: "s5 | "
      udp: true
    exclude-filter: "(?i)expire|expiring|traffic|remain|剩余|流量|过期|官网|套餐|到期|重置|订阅"

proxy-groups:
  # Real Bot API: GET /bot is 404 JSON. 200/301/302 matches DPI redirects.
  # Provider health-checks still use gstatic for general liveness.
  # All live providers compete in AUTO; url-test should drop nodes that
  # look fast on Google/DPI but cannot carry Bot API.
  - name: AUTO
    type: url-test
    use:
      - sub1
      - sub2
      - sub3
      - sub4
      - sub5
    url: https://api.telegram.org/bot
    interval: 30
    timeout: 4000
    tolerance: 100
    lazy: false
    max-failed-times: 1
    expected-status: 404
    exclude-filter: "(?i)expire|expiring|traffic|remain|剩余|流量|过期|官网|套餐|到期|重置|订阅|Anycast"

  - name: SUBSCRIBE
    type: fallback
    proxies:
      - DIRECT
      - AUTO
    # Same host family as provider URLs. Bot API would make DIRECT always fail
    # in RU, so every pull would go through the tunnel.
    url: https://github.com/favicon.ico
    expected-status: 200/204/301/302
    interval: 300
    timeout: 4000
    lazy: false
    max-failed-times: 1

  - name: PROXY
    type: select
    proxies:
      - AUTO
      - DIRECT

rules:
  - MATCH,AUTO
